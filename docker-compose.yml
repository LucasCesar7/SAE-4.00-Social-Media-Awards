services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: "8.5"
    container_name: sma-web
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: docker
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: social_media_awards
      DB_USER: sma_user
      DB_PASS: sma_password
      DB_CHARSET: utf8mb4
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html

  db:
    image: mysql:8.0.43
    container_name: sma-db
    environment:
      MYSQL_DATABASE: social_media_awards
      MYSQL_USER: sma_user
      MYSQL_PASSWORD: sma_password
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-schema/schema.sql:ro
      - ./docker/mysql/init/10-load-schema.sh:/docker-entrypoint-initdb.d/10-load-schema.sh:ro

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: sma-phpmyadmin
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8081:80"

volumes:
  mysql_data:
